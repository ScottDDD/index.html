<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1b3f8b">
<meta name="mobile-web-app-capable" content="yes">
<title>Türkçe kaartjes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface-2:#e4ecf1; --ink:#14213d; --muted:#5d6b82; --line:#d3dee6;
  --accent:#1b3f8b; --accent-ink:#ffffff; --accent-soft:#dbe6fb; --danger:#c8372d; --tile:#12908f;
  --dot:rgba(27,63,139,.07); --shadow:0 1px 2px rgba(20,33,61,.06),0 8px 22px -12px rgba(20,33,61,.28);
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-tr:'Literata',Georgia,'Times New Roman',serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1220; --surface:#151d31; --surface-2:#1e2842; --ink:#eaf0fb; --muted:#93a1bd; --line:#27324f;
    --accent:#7fb0ff; --accent-ink:#0a1226; --accent-soft:#1c2c52; --danger:#ff7a6d; --tile:#4fd1c5;
    --dot:rgba(127,176,255,.07); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#151d31; --surface-2:#1e2842; --ink:#eaf0fb; --muted:#93a1bd; --line:#27324f;
  --accent:#7fb0ff; --accent-ink:#0a1226; --accent-soft:#1c2c52; --danger:#ff7a6d; --tile:#4fd1c5;
  --dot:rgba(127,176,255,.07); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.4;
  min-height:100dvh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:22px 22px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,p{margin:0}
#app{max-width:640px;margin:0 auto;min-height:100dvh}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* kop */
.sticky{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;padding:10px 10px 8px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding-left:6px}
.brand h1{font-family:var(--font-tr);font-weight:700;font-size:1.65rem;line-height:1;letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:.85rem;margin-top:3px}
.ttl{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 6px;border-radius:12px}
.ttl h1{font-family:var(--font-tr);font-weight:700;font-size:1.35rem;line-height:1.15;display:flex;align-items:center;gap:8px}
.ttl h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl h1 svg{flex:none;color:var(--muted)}
.ttl p{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:6px;margin-top:2px}
.toolbar{padding:0 12px 10px}
.search{position:relative;display:flex;align-items:center}
.search>svg{position:absolute;left:13px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);
  padding:0 42px 0 42px;font:inherit;font-size:16px;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--accent);outline:none}
.search .clear{position:absolute;right:4px;width:38px;height:38px;border:0;background:transparent;border-radius:50%;display:none;place-items:center;color:var(--muted)}
.search.has .clear{display:grid}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}

main{padding:14px 12px 130px}
.stack{display:flex;flex-direction:column;gap:10px}

/* chips en labels */
.chip{--c:#6b7280;flex:none;display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;
  background:color-mix(in srgb,var(--c) 15%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink)}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
button.chip{min-height:38px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on::before{background:#fff}
.chip.sm{padding:2px 9px;font-size:.76rem;border-width:1px}
.chip.sm::before{width:7px;height:7px}
.chip.ghost{--c:#6b7280;background:transparent;border-style:dashed}
.chip.ghost::before{display:none}

/* rijen */
.row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);position:relative}
.row.dragging{z-index:12;transition:none!important;border-color:var(--accent);box-shadow:0 18px 34px -10px rgba(0,0,0,.4);will-change:transform}
.row-main{flex:1;min-width:0;padding:12px 6px 12px 15px;cursor:pointer;border-radius:14px;background:transparent;border:0;text-align:left;display:block}
.row .tr{font-family:var(--font-tr);font-weight:700;font-size:1.15rem;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.row .nl{color:var(--ink);opacity:.82;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.row .note{color:var(--muted);font-size:.92rem;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere;font-style:italic}
.row .grp{color:var(--accent);font-size:.8rem;font-weight:700;margin-bottom:3px}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.bulb{font-size:.85rem}
.row-side{display:flex;flex-direction:column;align-items:center;justify-content:center}
.row-side .icon-btn{width:44px;height:44px}
.handle{width:44px;flex:none;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:0 14px 14px 0}
.handle:active{cursor:grabbing;color:var(--accent)}
.row.group .row-main{display:flex;align-items:center;gap:14px;padding:14px 6px 14px 14px}
.g-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.g-name{font-family:var(--font-tr);font-weight:700;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.g-meta{color:var(--muted);font-size:.88rem;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:44px 20px}
.empty h2{font-family:var(--font-tr);font-size:1.3rem;color:var(--ink);margin-bottom:8px}
.empty .btns{display:flex;flex-direction:column;gap:10px;margin-top:22px;align-items:center}
.note-line{color:var(--muted);font-size:.85rem;text-align:center;margin-top:12px}

/* knoppen */
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--surface-2)}
.btn{border:0;border-radius:999px;padding:12px 22px;min-height:50px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding:26px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 55%,transparent);pointer-events:none}
.bar-in{display:flex;gap:10px;width:100%;max-width:640px;pointer-events:auto}
.bar-in .grow{flex:1}
.fab{width:56px;height:56px;min-height:0;padding:0;border-radius:18px;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 70%,#000)}

/* sheets */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,12,24,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.overlay.noanim,.overlay.noanim .sheet{animation:none}
.sheet{width:100%;max-width:600px;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;
  animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 22px;flex:none}
.sh-head h2{font-family:var(--font-tr);font-size:1.25rem;font-weight:700}
.sh-body{padding:6px 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
.fl{display:block;font-weight:700;font-size:.95rem;margin:16px 0 7px}
.fl small{font-weight:500;color:var(--muted);margin-left:6px}
.sub{color:var(--muted);font-size:.88rem;margin-top:8px}
.input,textarea.input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);resize:none;display:block}
.input:focus{border-color:var(--accent);outline:none}
textarea.tr-field{font-family:var(--font-tr);font-size:1.2rem;font-weight:500;min-height:92px}
textarea.input{min-height:56px;line-height:1.4}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
.tools{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;position:sticky;top:-6px;z-index:2;background:var(--surface);scrollbar-width:none;align-items:center}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;min-width:44px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:1.05rem;font-family:var(--font-tr)}
.tools button:active{background:var(--accent-soft)}
.tools .sep{flex:none;width:1px;height:26px;background:var(--line);margin:0 4px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:var(--surface-2);border-radius:16px}
.seg button{border:0;background:transparent;padding:11px 8px;border-radius:12px;font-weight:600;display:flex;gap:7px;align-items:center;justify-content:center;color:var(--muted)}
.seg .on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.lab-pick{display:flex;flex-wrap:wrap;gap:8px}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add .input{flex:1}
.inline-add .btn{min-height:0;padding:0 18px;border-radius:14px}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:14px 4px;border-bottom:1px solid var(--line)}
.menu-item:last-child{border:0}
.menu-item>svg{color:var(--accent);flex:none}
.menu-item small{display:block;color:var(--muted);font-size:.86rem}
.lab-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lab-row .input{flex:1;padding:9px 12px}
.lab-row .cnt{color:var(--muted);font-size:.85rem;min-width:22px;text-align:right}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1.5px var(--line);flex:none}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.preview{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:.9rem}
.preview b{display:block;margin-bottom:4px}
.preview div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
select.input{appearance:auto}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* studeren */
.study{display:flex;flex-direction:column;min-height:100dvh}
.st-top{display:flex;align-items:center;gap:6px;padding:10px 10px 4px}
.st-top .name{flex:1;min-width:0;font-family:var(--font-tr);font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-top .count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);padding:0 6px}
.st-opts{display:flex;gap:8px;padding:4px 14px 8px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;min-height:38px}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.prog{height:4px;background:var(--surface-2);margin:0 14px;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--tile);border-radius:4px;transition:width .3s}
.stage{position:relative;flex:1;min-height:340px;perspective:1400px;touch-action:pan-y}
.slider{position:absolute;inset:16px 14px}
.card3d{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.8,.25,1);transform-style:preserve-3d;cursor:pointer}
.card3d.flipped{transform:rotateY(180deg)}
.card3d.noanim{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px 22px;display:flex;overflow:auto;text-align:center}
.face::before{content:"";position:absolute;inset:9px;border-radius:19px;border:1.5px solid currentColor;opacity:.13;pointer-events:none}
.front{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.back{background:var(--accent);color:var(--accent-ink);transform:rotateY(180deg);box-shadow:var(--shadow)}
.face-in{margin:auto;width:100%;padding:24px 4px}
.big{font-family:var(--font-tr);font-weight:700;font-size:clamp(1.7rem,7.2vw,2.5rem);line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
.hint{margin:22px auto 0;max-width:28rem;padding:11px 15px;border-radius:14px;background:var(--surface-2);color:var(--muted);font-size:1rem;font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}
.face .speak{position:absolute;top:12px;right:12px;z-index:2;width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,currentColor 10%,transparent)}
.tapnote{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:.82rem;color:var(--muted);pointer-events:none}
.controls{display:flex;align-items:center;gap:12px;padding:6px 14px calc(18px + env(safe-area-inset-bottom))}
.controls .btn{flex:1;min-height:56px;font-size:1.05rem}
.round{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.round:active{background:var(--surface-2)}
.anim-l{animation:inL .28s ease}
.anim-r{animation:inR .28s ease}
.anim-f{animation:fade .25s ease}
@keyframes inR{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const fold = s => String(s || '').replace(/\*\*|__|\*/g, '').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i');
const plain = s => String(s || '').replace(/\*\*|__|\*/g, '').replace(/\n+/g, '. ');
function fmt(s) {
  let t = esc(s || '');
  t = t.replace(/\*\*([\s\S]+?)\*\*/g, '<b>$1</b>')
       .replace(/__([\s\S]+?)__/g, '<u>$1</u>')
       .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<i>$2</i>');
  return t;
}
const app = $('#app'), sheetRoot = $('#sheetRoot'), toastEl = $('#toast');
let toastT;
function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2400); }

const P = {
  back:'<path d="M15 5l-7 7 7 7"/>', next:'<path d="M9 5l7 7-7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  more:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
  grip:'<circle cx="9" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.5" fill="currentColor" stroke="none"/>',
  speaker:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  shuffle:'<path d="M3 7h3c3.5 0 5 10 9 10h4M3 17h3c1.6 0 2.8-1.7 3.8-3.6M14 7h5M17 4l3 3-3 3M17 14l3 3-3 3"/>',
  import:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/>',
  cards:'<rect x="4" y="7" width="13" height="14" rx="2"/><path d="M8 3.5h11a1 1 0 011 1V17"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  flip:'<path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3M18 3v4h-4M6 21v-4h4"/>'
};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const PALETTE = ['#d0433a', '#c9741a', '#2c9a68', '#12908f', '#3b6fd4', '#7a56c8', '#c4478c', '#6b7280'];

/* ---------- data ---------- */
const KEY = 'turkce-kaartjes-v1';
let storageOK = true;
function migrate(d) {
  const out = { v: 1, groups: [], labels: [], settings: { dir: 'tr', shuffle: false } };
  (d.labels || []).forEach(l => { if (l && l.id) out.labels.push({ id: String(l.id), name: String(l.name || 'Label'), color: l.color || PALETTE[7] }); });
  (d.groups || []).forEach(g => {
    if (!g || !g.id) return;
    out.groups.push({
      id: String(g.id), name: String(g.name || 'Groep'), type: g.type === 'list' ? 'list' : 'cards',
      items: (g.items || []).map(it => ({
        id: String(it.id || uid()), tr: String(it.tr || ''), nl: String(it.nl || ''), note: String(it.note || ''),

/* ---------- slepen om te sorteren ---------- */
function makeSortable(container, onDone) {

    ev.preventDefault();
    const kids = [...container.children].filter(c => c.hasAttribute('data-sort'));
    const idx = kids.indexOf(el); if (idx < 0) return;

    const rects = kids.map(k => { const r = k.getBoundingClientRect(); return { top: r.top + sy, bottom: r.bottom + sy, h: r.height }; });
    const gap = kids.length > 1 ? rects[1].top - rects[0].bottom : 0;

    el.classList.add('dragging');

    try { h.setPointerCapture(ev.pointerId); } catch (e) {}
    const update = () => {
      const dy = (curY + window.scrollY) - startY;
      el.style.transform = `translateY(${dy}px) scale(1.02)`;
      const center = rects[idx].top + dy + hh / 2;
      let n = 0;
      rects.forEach((r, j) => { if (j !== idx && (r.top + r.bottom) / 2 < center) n++; });
      newIdx = n;
      kids.forEach((k, j) => {
        if (j === idx) return;
        let t = 0;
        if (idx < newIdx && j > idx && j <= newIdx) t = -(hh + gap);
        else if (idx > newIdx && j >= newIdx && j < idx) t = hh + gap;
        k.style.transform = t ? `translateY(${t}px)` : '';

      update(); raf = requestAnimationFrame(tick);
    };

    const end = cancel => {
      done = true; cancelAnimationFrame(raf);
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', cn);
      if (cancel) newIdx = idx;
      let off = 0;
      if (newIdx > idx) off = rects[newIdx].bottom - hh - rects[idx].top;
      else if (newIdx < idx) off = rects[newIdx].top - rects[idx].top;
      el.classList.remove('dragging');
      el.style.transition = 'transform .18s ease';
      el.style.transform = `translateY(${off}px)`;
      setTimeout(() => {
        kids.forEach(k => { k.style.transition = ''; k.style.transform = ''; });

}

function renderSheet(entry, o = {}) {

  sheetRoot.innerHTML = `<div class="overlay ${o.noanim ? 'noanim' : ''}" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true">${sheetHTML(entry)}</div></div>`;
  sheetShown = entry;
  sheetRoot.querySelectorAll('.autogrow').forEach(autosize);
  if (entry.sheet === 'import') updatePreview();
  if (!o.noanim) {
    if (entry.sheet === 'item' && !entry.data.iid) setTimeout(() => { const f = $('#f-tr'); if (f) f.focus(); }, 280);
    if (entry.sheet === 'group' && !entry.data.gid) setTimeout(() => { const f = $('#g-name'); if (f) f.focus(); }, 280);
  }
}
function rerenderSheet() { renderSheet(top(), { force: true, noanim: true }); }
function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 320) + 'px'; }

let lastTA = null;

function insertText(kind, val) {
  const ta = lastTA && document.body.contains(lastTA) ? lastTA : $('#f-tr'); if (!ta) return;
  const s = ta.selectionStart, en = ta.selectionEnd;
  if (kind === 'char') { ta.setRangeText(val, s, en, 'end'); }

/* importeren */
function parseTable(text) {
  text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const cnt = (line, ch) => { let q = false, n = 0; for (const c of line) { if (c === '"') q = !q; else if (!q && c === ch) n++; } return n; };
  const first = text.split('\n', 1)[0] || '';
  const tabs = cnt(first, '\t'), semi = cnt(first, ';'), comma = cnt(first, ',');
  const delim = tabs > 0 ? '\t' : (semi > 0 && semi >= comma ? ';' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ''));
}
const HEADERS = ['turks', 'turkish', 'turkce', 'tr', 'woord', 'word', 'nederlands', 'nl', 'vertaling', 'translation', 'dutch', 'betekenis', 'toelichting', 'hint', 'labels', 'label'];
function looksLikeHeader(rows) { return rows.length > 1 && (HEADERS.includes(fold(rows[0][0])) || HEADERS.includes(fold(rows[0][1] || ''))); }
function importedRows(d) {
  let rows = parseTable(d.text || '');
  if (d.header) rows = rows.slice(1);
  return rows.map(r => {
    const a = r[0] || '', b = r[1] || '';
    return { tr: d.swap ? b : a, nl: d.swap ? a : b, note: r[2] || '', labels: (r[3] || '').split(/[|;,]/).map(s => s.trim()).filter(Boolean) };
  }).filter(r => r.tr || r.nl);
}
function updatePreview() {
  const e = top(); if (e.sheet !== 'import') return;
  const el = $('#impPreview'); if (!el) return;
  const rows = importedRows(e.data);
  const go = $('#impGo');
  if (!e.data.text.trim()) { el.innerHTML = 'Nog niets ingelezen.'; if (go) go.disabled = true; return; }
  if (go) go.disabled = !rows.length;
  el.innerHTML = rows.length
    ? `<b>${rows.length} ${rows.length === 1 ? 'rij' : 'rijen'} gevonden</b>` + rows.slice(0, 3).map(r => `<div>${esc(r.tr.replace(/\n/g, ' / '))}  =  ${esc(r.nl.replace(/\n/g, ' / '))}</div>`).join('')
    : 'Geen bruikbare rijen gevonden. Controleer of de kolommen kloppen.';
}
function decodeBuf(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { try { return new TextDecoder('windows-1254').decode(buf); } catch (e2) { return new TextDecoder().decode(buf); } }
}
function loadXLSX() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('xlsx'));
    document.head.appendChild(s);
  });
}
async function handleFile(file) {
  const e = top(); if (e.sheet !== 'import' || !file) return;
  const d = e.data; let text = '';
  try {
    if (/\.xlsx?$/i.test(file.name)) {
      toast('Excel-bestand lezen...');
      await loadXLSX();
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      text = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: ',', blankrows: false });
    } else text = decodeBuf(await file.arrayBuffer());
  } catch (err) { toast('Bestand lezen lukt niet. Sla het op als CSV of plak de cellen.'); return; }
  if (top() !== e) return;
  d.text = text.replace(/^\uFEFF/, ''); d.fileName = file.name;
  if (d.target === 'new' && !d.name) { d.name = file.name.replace(/\.[^.]+$/, ''); $('#imp-name').value = d.name; }
  if (!d.headerTouched) { d.header = looksLikeHeader(parseTable(d.text)); $('#imp-header').checked = d.header; }
  $('#imp-text').value = d.text; $('#fileName').textContent = file.name;
  autosize($('#imp-text')); updatePreview(); toast('Bestand ingelezen');
}
function doImport() {
  const e = top(); if (e.sheet !== 'import') return;
  const d = e.data, rows = importedRows(d);
  if (!rows.length) { toast('Er valt niets te importeren'); return; }
  let g;
  if (d.target === 'new') {
    const name = (d.name || '').trim() || 'Geïmporteerd';
    g = { id: uid(), name, type: d.type, items: [] }; S.groups.push(g);
  } else g = G(d.target);
  if (!g) { toast('Groep niet gevonden'); return; }
  rows.forEach(r => g.items.push({ id: uid(), tr: r.tr, nl: r.nl, note: r.note, labels: [...new Set(r.labels.map(n => labelByName(n).id))] }));
  commit(); toast(`${rows.length} ${rows.length === 1 ? 'item' : 'items'} geïmporteerd`);
  const b = hist.stack[baseIndex()];
  if (b.name === 'group' && b.id === g.id) back();
  else { ui.gid = null; replace({ name: 'group', id: g.id }); }
}

  'toggle-item-label': t => {
    const d = top().data.draft, id = t.dataset.id, i = d.labels.indexOf(id);
    if (i >= 0) d.labels.splice(i, 1); else d.labels.push(id);
    t.classList.toggle('on', i < 0);
  },
  'add-item-label': () => {
    readDraft();
    addLabelFrom('f-newlab', l => { const d = top().data.draft; if (!d.labels.includes(l.id)) d.labels.push(l.id); rerenderSheet(); });
  },
  'open-labels': () => openSheet('labels'),
  'add-label': () => addLabelFrom('lab-new', (l, ex) => { if (ex) toast('Dit label bestaat al'); rerenderSheet(); const i = $('#lab-new'); if (i) i.focus(); }),
  'cycle-color': t => { const l = L(t.dataset.id); if (!l) return; l.color = PALETTE[(PALETTE.indexOf(l.color) + 1) % PALETTE.length]; t.style.setProperty('--c', l.color); commit(); },
  'del-label': t => {
    const l = L(t.dataset.id); if (!l) return;
    openSheet('confirm', { title: 'Label verwijderen?', text: `"${l.name}" wordt van alle kaarten gehaald. De kaarten zelf blijven bestaan.`, ok: 'Verwijderen',
      cb: () => { S.labels = S.labels.filter(x => x.id !== l.id); S.groups.forEach(g => g.items.forEach(it => { it.labels = it.labels.filter(x => x !== l.id); })); ui.labs.delete(l.id); commit(); } });
  },
  'open-import': () => {
    const b = hist.stack[baseIndex()];
    openSheet('import', { target: b.name === 'group' && G(b.id) ? b.id : 'new', name: '', type: 'cards', text: '', header: false, headerTouched: false, swap: false, fileName: '' });
  },
  'do-import': () => doImport(),
  'open-backup': () => openSheet('backup'),
  'copy-backup': async () => { const ta = $('#bk-out'); toast((await copyText(ta.value, ta)) ? 'Gekopieerd' : 'Kopiëren mislukt: selecteer de tekst en kopieer handmatig'); },
  'restore-backup': () => {
    let d; try { d = JSON.parse($('#bk-in').value); if (!d || !Array.isArray(d.groups)) throw 0; } catch (e) { toast('Dit lijkt geen geldige back-up'); return; }
    openSheet('confirm', { title: 'Alles vervangen?', text: `Je huidige gegevens worden vervangen door de back-up (${d.groups.length} groepen).`, ok: 'Herstellen',
      cb: () => { replaceAll(d); popTo(x => x.name === 'home'); toast('Back-up hersteld'); return 'nav'; } });
  },
  sample: () => addSample(),
  speak: t => { const g = G(t.dataset.g), it = g && g.items.find(x => x.id === t.dataset.i); if (it) speakTR(it.tr); },
  study: () => { const b = hist.stack[baseIndex()]; if (b.name === 'group') startStudy(b.id); },
  flip: () => flipStudy(),
  next: () => stepStudy(1),
  prev: () => stepStudy(-1),
  shuffle: () => {
    if (!study) return;
    const cur = study.ids[study.i];
    S.settings.shuffle = !S.settings.shuffle; persist();
    if (S.settings.shuffle) { study.ids = shuffleArr(study.base); study.i = 0; }
    else { study.ids = study.base.slice(); study.i = Math.max(0, study.ids.indexOf(cur)); }
    const b = $('#shufBtn'); b.classList.toggle('on', S.settings.shuffle); b.setAttribute('aria-pressed', S.settings.shuffle);
    updateStudyCard('anim-f'); toast(S.settings.shuffle ? 'Willekeurige volgorde' : 'Vaste volgorde');
  },
  dir: () => {
    S.settings.dir = S.settings.dir === 'tr' ? 'nl' : 'tr'; persist();
    $('#dirBtn').textContent = S.settings.dir === 'tr' ? 'Turks naar Nederlands' : 'Nederlands naar Turks';
    updateStudyCard('anim-f');
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('pointerdown', e => { if (e.target.closest('.tools button')) e.preventDefault(); });
document.addEventListener('mousedown', e => { if (e.target.closest('.tools button')) e.preventDefault(); });
document.addEventListener('click', e => {
  const b = e.target.closest('.tools button'); if (!b) return;
  if (b.dataset.ins === 'wrap') insertText('wrap', b.dataset.m); else insertText('char', b.dataset.c);
});
document.addEventListener('input', e => {
  const t = e.target, id = t.id;
  if (t.classList.contains('autogrow')) autosize(t);
  if (id === 'q') { ui.q = t.value; $('#qWrap').classList.toggle('has', !!t.value); refreshItems(); }
  else if (id === 'hq') { ui.hq = t.value; $('#hqWrap').classList.toggle('has', !!t.value); refreshHome(); }
  else if (id === 'imp-text') {
    const d = top().data; d.text = t.value;
    if (!d.headerTouched) { d.header = looksLikeHeader(parseTable(d.text)); $('#imp-header').checked = d.header; }
    updatePreview();
  }
  else if (id === 'imp-name') top().data.name = t.value;
  else if (t.dataset && t.dataset.lbl) { const l = L(t.dataset.lbl), v = t.value.trim(); if (l && v) { l.name = v; commit(); } }
});
document.addEventListener('change', e => {
  const t = e.target, id = t.id;
  if (id === 'imp-target') { const d = top().data; d.target = t.value; $('#impNew').style.display = t.value === 'new' ? 'block' : 'none'; }
  else if (id === 'imp-header') { const d = top().data; d.header = t.checked; d.headerTouched = true; updatePreview(); }
  else if (id === 'imp-swap') { top().data.swap = t.checked; updatePreview(); }
  else if (id === 'imp-file') { const f = t.files && t.files[0]; if (f) handleFile(f); t.value = ''; }
  else if (t.dataset && t.dataset.lbl) { const l = L(t.dataset.lbl); if (l && !t.value.trim()) t.value = l.name; }
});
document.addEventListener('keydown', e => {
  const id = e.target.id;
  if (e.key === 'Enter' && id === 'lab-new') { e.preventDefault(); A['add-label'](); return; }
  if (e.key === 'Enter' && id === 'f-newlab') { e.preventDefault(); A['add-item-label'](); return; }
  if (e.key === 'Enter' && id === 'g-name') { e.preventDefault(); A['save-group'](); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.row-main[role="button"]')) { e.preventDefault(); A['edit-item'](e.target); return; }
  if (e.key === 'Escape' && top().sheet) { back(); return; }
  if (top().sheet || (e.target.matches && e.target.matches('input,textarea,select'))) return;
  if (top().name === 'study') {
    if (e.key === 'ArrowRight') stepStudy(1);
    else if (e.key === 'ArrowLeft') stepStudy(-1);
    else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flipStudy(); }
  }
});

if (!storageOK) setTimeout(() => toast('Opslaan op dit toestel is niet beschikbaar. Maak regelmatig een back-up.'), 600);
render();
})();
</script>
</body>
</html>
